
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RanCafe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fceef5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #0c0609;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            margin-top: 10px;
        }
        footer{
            background-color: #ecc9d9;
            color: rgb(189, 247, 83);
            text-align: center;
            margin: 150px 0px;
            padding: 25px;

        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffe1ee;
            text-decoration: underline;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 30px 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 35px;
            max-width: 1100px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #0f0108;
            margin-bottom: 20px;
        }

        .contact-details {
            background-color: #fafafa;
            padding: 40px;
            width: 40%;
            border-right: 1px solid #eeeeee;
           
        }

        .contact-details h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            
        }

        .detail-item {
            margin-bottom: 25px;
        }

        .detail-item h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #0f0e0e;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-item p {
            font-size: 0.95rem;
            color: #333333;
            line-height: 1.5;
        }

        /* MESSAGE FORM SECTION (RIGHT) */
        .message-form {
            padding: 40px;
            width: 60%;
        }

        .message-form h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: #444;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #000000;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* BUTTON */
        .btn-submit {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 0.85rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 50%;
        }

        .btn-submit:hover {
            background-color: #333333;
        }
