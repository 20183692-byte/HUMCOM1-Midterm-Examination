<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RanCafe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fceef5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #0c0609;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffe1ee;
            text-decoration: underline;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 30px 20px;
        }

        .card {
            background-color: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #0f0108;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #130109;
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 15px;
        }

        footer {
            background-color: #13080d;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 480px) {
            nav a {
                display: inline-block;
                margin: 5px 8px;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Rancafe</h1>
        <p></p>

        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="media.html">Media</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main id="home">
        <div class="card">
            <h2>Media Showcase</h2>
            
            <audio controls>
                <source src="media.mp3" type="audio/mpeg">
            </audio>
            <h2 id="about"></h2>

            <p>Figure 1: Audio Introduction detailing portfolio architecture.
                
            </p>

            <p id="services">
                
            </p>

            <p id="contact" style="margin-top: 20px;">
               
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Rancafe</p>
    </footer>

</body>
</html>
